name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/scan_secrets.py
      - run: uvx ruff@0.14.13 check --select F,I,UP,B bot.py delete_messages.py voicebot tests scripts
      - run: uv run python -m compileall -q bot.py delete_messages.py voicebot tests
      - run: uv run python -m unittest discover -s tests -v
