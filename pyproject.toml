[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-voice-memo-bot"
version = "2.0.0"
description = "A private Discord voice-memo transcription, summary, and Obsidian sync bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py==2.7.1",
  "groq==1.7.0",
  "python-dotenv==1.2.3",
]

[project.scripts]
voicebot = "voicebot.cli:main"

[tool.uv]
required-version = "==0.11.21"
package = true

[tool.setuptools]
packages = ["voicebot"]
py-modules = ["bot", "delete_messages"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
